# Render blueprint — https://render.com/docs/blueprint-spec
#
# Stack gratuito perpétuo (docs/DEPLOY-KOYEB-NEON.md, renomeado para
# DEPLOY-FREE.md): o Postgres NÃO vem do Render — o plano free deles EXPIRA
# aos 30 dias. A base é o Supabase (ou Neon), definida manualmente em
# DATABASE_URL. A ingestão corre via /api/cron/run (ping externo a cada
# 30 min) e, como reforço, no próprio arranque do serviço (RUN_WORKER_IN_WEB).
#
# Deploy: Render → New → Blueprint → escolher o repositório, ou Web Service
# avulso. Alternativa Docker: o Dockerfile funciona igualmente (escolher
# runtime Docker na UI; o blueprint mantém runtime node porque o gate
# check-prod-build.ts exige buildCommand com npm ci --include=dev).

services:
  - type: web
    name: gni-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL        # Supabase/Neon (pooler) — NUNCA Render Postgres
        sync: false
      - key: VIEW_SALT           # roda o hash de sessões de visualização
        generateValue: true
      - key: ADMIN_TOKEN         # bearer token para /api/admin/*
        generateValue: true
      - key: CRON_TOKEN          # header x-cron-token do POST /api/cron/run
        generateValue: true
      - key: PUBLIC_BASE_URL     # URL do Render, para canonicals/sitemap
        sync: false
      - key: RUN_WORKER_IN_WEB   # cada acordar/disparo corre um ciclo
        value: "true"
      - key: CYCLE_MINUTES
        value: "30"
