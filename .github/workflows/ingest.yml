name: Scheduled Ingestion

# Ingestão no stack gratuito perpétuo: o web service (Koyeb) só serve;
# este workflow corre o ciclo completo do pipeline contra o Neon.
# Ver docs/DEPLOY-KOYEB-NEON.md — incluindo a matemática de CU-hours do Neon
# que motiva o intervalo de 30 minutos (10 min excederiam as 100 CU-h/mês).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # execução manual: Actions → Scheduled Ingestion → Run workflow

# Nunca acumular: se um ciclo demorar mais que o intervalo, não empilhar execuções.
concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  worker-once:
    runs-on: ubuntu-latest
    # Mata execuções penduradas antes que queimem minutos (repos privados).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      # --include=dev: o tsx do worker:once é devDependency (mesma razão de
      # scripts/check-prod-build.ts para o Render).
      - run: npm ci --include=dev

      - name: Run one ingestion cycle
        env:
          # O worker só precisa da base de dados. ADMIN_TOKEN/VIEW_SALT/PUBLIC_BASE_URL
          # são do processo web (Koyeb); chaves LLM são opcionais e nunca aqui.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run worker:once
